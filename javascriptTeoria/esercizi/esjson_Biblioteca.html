<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const url = "./biblioteca.json"
        fetch(url)
            .then(response => response.json())
            .then(dati => {
                const datiJson = dati;
                console.log(datiJson)
                datiJson.prodotti.forEach(element => {

                    // FIND
                    let utente = element.prestito.find(p => p.nomeUtente.toLowerCase() === "ciartano isabel");
                    // FILTER
                    let utente_filtrato = element.prestito.filter(p => p.nomeUtente.trim().toLowerCase() === "ciartano isabel");
                    console.log("RISULTATO FIND:", utente);
                    console.log("RISULTATO FILTER:", utente_filtrato);

                });
            });

    </script>

</body>

</html>
