<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcio 1</title>
</head>
<body>
    <style>
        #articoli{
            display: flex;
            flex-direction: column;
            gap: 40px;
        }
        .card{
            box-shadow: 0 4px 8px 0 rgb(0, 0, 0 ,0.2);
            transition:0.3s;
        }
           .card:hover {
            box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.2);
        }

        .container {
            padding: 2px 16px;
        }
    </style>
    <div id="articoli">
        <div id="abbigliamento"><h1>ABBIGLIAMENTO</h1><br></div>
        <div id="calzature"><h1>CALZATURE</h1><br></div>
        <div id="attrezzatura"><h1>ATTREZZATURA</h1><br></div>
        <div id="merch"><h1>MERCHANDISING</h1><br></div>
        <div id="accessori"><h1>ACCESSORI</h1><br></div>
    </div>
    
</body>

<script>
    const abbigliamento=document.getElementById("abbigliamento")
    const calzature=document.getElementById("calzature")
    const attrezzatura=document.getElementById("attrezzatura")
    const merch=document.getElementById("merch")
    const accessori=document.getElementById("accessori")


function cardArticolo(art){
    const card=document.createElement("div")
    card.className="card"

    const nome=document.createElement("h2")
    nome.textContent=art.nome
    const desc=document.createElement("p")
    desc.textContent=art.descrizione_breve
    const img=document.createElement("img")
    img.src=art.immagine
    const pr=document.createElement("h3")
    pr.textContent=art.prezzo

    card.appendChild(nome)
    card.appendChild(img)
    card.appendChild(desc)
    card.appendChild(pr)

    if(art.tipo_articolo==="abbigliamento"){
        abbigliamento.appendChild(card)
    }
    if(art.tipo_articolo==="calzature"){
        calzature.appendChild(card)
    }
    if(art.tipo_articolo==="attrezzatura"){
        attrezzatura.appendChild(card)
    }
    if(art.tipo_articolo==="merchandising"){
        merch.appendChild(card)
    }
    if(art.tipo_articolo==="accessori"){
        accessori.appendChild(card)
    }
}

    const URL ="./articoli_calcio.json"
    fetch(URL)
    .then(response=>response.json())
    .then(dati=>{
        const datiJson=dati
        datiJson.forEach(element => {
            console.log(element)
            cardArticolo(element)
        });
    })
</script>
</html>
