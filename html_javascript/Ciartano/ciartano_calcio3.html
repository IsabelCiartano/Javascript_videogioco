                function aggiungiTeam(id,ruolo_team,array){
                    let esiste=array.find(element=>element.id===id)
                    if(esiste){
                        alert("impossibile inserire ")
                       
                    }else{
                        array.push({id:id})
                    }
                
                    stampaTeam(array)
                }

                function mostraGiocatore(giocatore) {
                    const card = document.createElement("div")
                    card.className = "card"

                    const nome = document.createElement("h2")
                    nome.textContent = giocatore.nome

                    const cognome = document.createElement("h2")
                    cognome.textContent = giocatore.cognome

                    const foto = document.createElement("img")
                    foto.src = giocatore.foto

                    const ruolo = document.createElement("p")
                    ruolo.textContent = giocatore.ruolo

                    const anno = document.createElement("p")
                    anno.textContent = giocatore.anno_nascita

                    const squadra = document.createElement("p")
                    squadra.textContent = giocatore.squadra_attuale

                    const mercato = document.createElement("p")
                    mercato.textContent = giocatore.valore_market_euro

                    card.appendChild(nome)
                    card.appendChild(cognome)
                    card.appendChild(foto)
                    card.appendChild(ruolo)
                    card.appendChild(anno)
                    card.appendChild(squadra)
                    card.appendChild(mercato)
                    const btn_team = document.createElement("button")
                    btn_team.type = "button"
                    btn_team.textContent = "aggiungi al team "
                    card.appendChild(btn_team)

                    btn_team.addEventListener("click", function () {
                        aggiungiTeam(giocatore.id, giocatore.ruolo, allstarsteam)
                    })

                    risultati.appendChild(card)
                }
                const URL = "./giocatori.json"

                fetch(URL)
                    .then(response => response.json())
                    .then(dati => {
                        datiJson = dati

                        //console.log(datiJson)

                            //console.log(element)
