<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinesi 3</title>
</head>

<body>
    <style>
        #piatti{
    display:flex;
    flex-direction:column;
    gap:40px;
}
        .card {
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }


        .card:hover {
            box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.2);
        }

        .container {
            padding: 2px 16px;
        }
    </style>
    <div id="piatti">
        <div id="antipasti"> <h1>antipasti</h1><br></div>
        <div id="primipiatti"> <h1>Primi piatti </h1><br></div>
        <div id="secondopiatto"> <h1>Secondi piatti </h1><br></div>
        <div id="contorni"> <h1>Contorni</h1><br></div>
        <div id="dolci"> <h1>Dolci</h1><br></div>
    </div>

    <h1>CARRELLO</h1><br>
    <table id="carrello"></table>
    <p>Totale : </p>
    <div id="totale"></div>
    
</body>
<script>
    const antip=document.getElementById("antipasti");
    const primo=document.getElementById("primipiatti");
    const secondo=document.getElementById("secondopiatto")
    const contorno=document.getElementById("contorni")
    const dolce=document.getElementById("dolci")

    const carrello=document.getElementById("carrello");
    const totale=document.getElementById("totale");

    let piatti=[]
    let carr=[]
    let totaleCarrello = 0;



function mostraPiatti(piatto){
        const card=document.createElement("div")
        card.className="card"

        const nome=document.createElement("h2");
        nome.textContent= piatto.nome;

        const desc=document.createElement("p");
        desc.textContent=piatto.descrizione_breve;

        const prezzo=document.createElement("p");
        prezzo.textContent=piatto.prezzo;

        const img=document.createElement("img");
        img.src=piatto.immagine

        card.appendChild(nome)
        card.appendChild(img)
        card.appendChild(desc)
        card.appendChild(prezzo)

        //bottone carrello______________________________________________________________________

        const btn_carrello=document.createElement("button")
        btn_carrello.type="button";
        btn_carrello.textContent="ORDINA";
        card.appendChild(btn_carrello)

        btn_carrello.addEventListener("click",function(){aggiungiCarrello(piatto.id,carr)})

        //lista piatti _________________________________________________________________________

        if(piatto.tipo_piatto === "antipasto"){
            antip.appendChild(card)
        }
        if(piatto.tipo_piatto === "primopiatto"){
            primo.appendChild(card)
        }
         if(piatto.tipo_piatto === "secondopiatto"){
            secondo.appendChild(card)
        }
         if(piatto.tipo_piatto === "dolce"){
            dolce.appendChild(card)
        }
         if(piatto.tipo_piatto === "contorno"){
            contorno.appendChild(card)
        }   
    }

function aggiungiCarrello(id,array){

    let esiste = array.find(element => element.id === id);

    if(esiste){
        esiste.quantita += 1;
    }else{
        array.push({
            id: id,
            quantita: 1,
        });
    }

    stampaCarrello(array);
}

function stampaCarrello(array){

    carrello.innerHTML = "";

    array.forEach(element => {

        const piatto = piatti.find(p => p.id === element.id);

        const riga = document.createElement("tr");

        const n = document.createElement("td");
        n.textContent = piatto.nome;
        const t=document.createElement("td");
        t.textContent=piatto.tipo_piatto;
        const id=document.createElement("td")
        id.textContent=piatto.id;
        const quantita = document.createElement("td");
        quantita.textContent = element.quantita;
        
        riga.appendChild(id)
        riga.appendChild(t)
        riga.appendChild(n);
        riga.appendChild(quantita);

        carrello.appendChild(riga);

        totaleCarrello += piatto.prezzo;
        totale.textContent = totaleCarrello;
    });
}



    
const url="./piatti_cinesi.json"
fetch(url)
    .then(response=>response.json())
    .then(dati=>{
        const datiJson=dati;
        console.log(datiJson);
        piatti=datiJson;
        datiJson.forEach(element => {
            console.log(element)
             mostraPiatti(element) 
        });
        
    })

    
</script>
</html>
