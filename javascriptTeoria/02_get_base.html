<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <title>🎮 La Mia Collezione — GET</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin: 12px 0;
    }

    .genere {
      color: #666;
      font-size: 14px;
    }

    .errore {
      color: red;
    }
  </style>
</head>

<body>

  <h1>🎮 La Mia Collezione</h1>
  <label>Gioco</label>
  <input type="text">
  <button id ="cerca">Cerca</button>
  <div id="lista-giochi"></div>


  <script>
    // ── TODO 1: inserisci qui il tuo URL da MockAPI ───────────
    const API_URL = "https://69f9a3b3c509a40d3aa2e0a6.mockapi.io/api/v1/videogiochi";

    function creaCardGioco(gioco) {
      const card = document.createElement("div");
      card.classList.add("card");
      card.innerHTML = `
        <h3>${gioco.titolo}</h3>
        <p class="genere">${gioco.genere} — ${gioco.anno}</p>
      `;
      return card;
    }

    function mostraGiochi(giochi) {
      const lista = document.getElementById("lista-giochi");
      lista.innerHTML = "";
      giochi.forEach((gioco) => lista.appendChild(creaCardGioco(gioco)));
    }

    // ── TODO 2: completa la funzione caricaGiochi() ───────────
    // Deve:
    //   a) mostrare "Caricamento..." nella lista mentre aspetta
    //   b) chiamare fetch(API_URL)
    //   c) nel primo .then() controllare risposta.ok,
    //      poi restituire risposta.json()
    //   d) nel secondo .then() chiamare mostraGiochi()
    //   e) nel .catch() mostrare un messaggio di errore in rosso
    function caricaGiochi() {
      const lista = document.getElementById("lista-giochi");

      // scrivi qui il codice fetch con .then() e .catch()

      fetch(API_URL)
        .then(response => {
          if (!response.ok) {//se ok status = 200, altrimenti per esempio Not Fount = 404
            throw new Error(`Errore HTTP: ${response.status}`);
          }
          return response.json(); // Converte la risposta in formato JSON,

          // è una promise (il parsing del JSON richiede del tempo)

        })
        .then(data => mostraGiochi(data))
        .catch(error => console.error('Errore:', error));

    }
    caricaGiochi();
  </script>

</body>

</html>
